<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DevCentr">
  <title>DevCentr (motion)</title>
  <desc>Self-contained animated brand mark: orbiting rings, satellite nodes, pulsing hub. CSS animations inside the SVG — no JS player. Open as a document or inline the SVG; many browsers freeze animation when the file is used only as an img src.</desc>
  <defs>
    <linearGradient id="hub" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <style><![CDATA[
      @media (prefers-reduced-motion: reduce) {
        .spin, .spin-rev, .pulse { animation: none !important; }
      }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 48s linear infinite; }
      .spin-rev { transform-box: fill-box; transform-origin: center; animation: spin-rev 36s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-rev { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
    ]]></style>
  </defs>

  <g class="spin">
    <circle cx="256" cy="256" r="198" fill="none" stroke="#0F766E" stroke-width="18" stroke-dasharray="42 28" opacity="0.9"/>
    <circle cx="256" cy="58" r="16" fill="#14B8A6"/>
  </g>

  <g class="spin-rev">
    <circle cx="256" cy="256" r="138" fill="none" stroke="#14B8A6" stroke-width="14" stroke-dasharray="56 36" stroke-linecap="round"/>
    <circle cx="430" cy="340" r="14" fill="#0F766E"/>
    <circle cx="82" cy="340" r="14" fill="#0F766E"/>
  </g>

  <circle cx="256" cy="256" r="82" fill="none" stroke="#0F766E" stroke-width="10" opacity="0.85"/>

  <g transform="translate(256 256) rotate(45)">
    <g class="pulse">
      <rect x="-36" y="-36" width="72" height="72" rx="10" fill="url(#hub)"/>
    </g>
  </g>
</svg>
