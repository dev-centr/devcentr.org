<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GitHub Actions Editor — Auth</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Segoe UI",system-ui,sans-serif; background:#f5f6f8; color:#1f2328; }
    .card { width:min(480px,92vw); background:#fff; border:1px solid #d0d7de; border-radius:12px; padding:2rem; box-shadow:0 8px 30px rgba(0,0,0,.06); text-align:center; }
    h1 { margin:0 0 .35rem; font-size:1.8rem; }
    .sub { color:#656d76; margin-bottom:1.75rem; }
    label { display:block; text-align:left; font-size:.9rem; margin-bottom:.35rem; }
    input { width:100%; padding:.75rem .85rem; border:1px solid #d0d7de; border-radius:8px; font:inherit; margin-bottom:.55rem; }
    .hint, .scopes { text-align:left; color:#656d76; font-size:.8rem; margin:.2rem 0; }
    button { margin-top:1rem; background:#1f6feb; color:#fff; border:0; border-radius:8px; padding:.7rem 1.4rem; font:inherit; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GitHub Actions Editor</h1>
    <p class="sub">Connect your GitHub account to get started</p>
    <label>Personal Access Token</label>
    <input value="ghp_••••••••••••••••demo" readonly />
    <p class="hint">Create a token at GitHub Settings → Developer settings → Personal access tokens</p>
    <p class="scopes">Required scopes: repo, read:org</p>
    <button>Connect</button>
  </div>
</body>
</html>
